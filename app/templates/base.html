<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rental Accounting{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong>🏠 Casa Italia</strong></li>
      </ul>
      <ul class="nav-links">
        <li><a href="/" {% if active=='dashboard' %}class="active"{% endif %}>Dashboard</a></li>
        <li><a href="/income" {% if active=='income' %}class="active"{% endif %}>Income</a></li>
        <li><a href="/expenses" {% if active=='expenses' %}class="active"{% endif %}>Expenses</a></li>
        <li><a href="/investments" {% if active=='investments' %}class="active"{% endif %}>Investments</a></li>
        <li><a href="/documents" {% if active=='documents' %}class="active"{% endif %}>Invoices</a></li>
        <li><a href="/taxes" {% if active=='taxes' %}class="active"{% endif %}>Taxes</a></li>
        <li><a href="/property" {% if active=='property' %}class="active"{% endif %}>Settings</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container">
    <small>Estimates to support your commercialista — not official filings.</small>
  </footer>
</body>
</html>
